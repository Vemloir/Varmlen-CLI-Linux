name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Also asserts the binaries carry no build-machine paths.
      - run: ./scripts/build-release.sh

      - name: Package
        run: |
          set -eu
          name=varmlen-cli-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/release/varmlen-cli target/release/varmlend target/release/varmlen-net "dist/$name/"
          cp packaging/varmlend@.service packaging/install.sh "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect checksums
        run: |
          set -eu
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
