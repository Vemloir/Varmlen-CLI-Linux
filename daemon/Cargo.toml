[package]
name = "varmlend"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Privileged networking daemon for Varmlen"

[lib]
name = "varmlend"
path = "src/lib.rs"

[[bin]]
name = "varmlend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
nix = { version = "0.30", features = ["fanotify", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
