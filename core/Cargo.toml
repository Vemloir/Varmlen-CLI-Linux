[package]
name = "varmlen-core"
description = "Shared xray config, subscription and daemon-protocol logic for Varmlen clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
percent-encoding = "2"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "net", "time"] }
varmlend = { path = "../daemon" }
